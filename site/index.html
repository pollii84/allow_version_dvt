<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A runnable Alloy development environment.">
    <title>Alloy Workspace</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17211b;
        background: #f1f0e8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
      }

      article {
        width: min(100%, 760px);
        border: 1px solid #c9cabe;
        background: #faf9f3;
        box-shadow: 12px 12px 0 #1f5c3f;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid #c9cabe;
        padding: 18px 24px;
      }

      .brand {
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #24533b;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .status::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2d7b52;
        content: "";
      }

      section {
        padding: clamp(36px, 8vw, 72px);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #946124;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 600px;
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.6rem, 8vw, 5.3rem);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      p {
        max-width: 560px;
        margin: 24px 0 0;
        color: #4e5851;
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      footer {
        border-top: 1px solid #c9cabe;
        padding: 16px 24px;
        color: #59635c;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
      }

      @media (max-width: 520px) {
        main {
          padding: 20px;
        }

        article {
          box-shadow: 7px 7px 0 #1f5c3f;
        }

        header {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <header>
          <span class="brand">Alloy Workspace</span>
          <span class="status">Environment online</span>
        </header>
        <section>
          <p class="eyebrow">Ready to build</p>
          <h1>Your workspace is running.</h1>
          <p>
            This repository now has a containerized development baseline. The preview is served by Nginx and is ready for the application to grow from here.
          </p>
        </section>
        <footer>site · nginx · port 3000</footer>
      </article>
    </main>
  </body>
</html>
